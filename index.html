<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Link Video Player - Designed & Developed by Darpan Sukla</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
        }
        .liquid-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 1);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
        }
        .transition-opacity-custom {
            transition: opacity 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 bg-white">

    <!-- Top Creator Branding Header -->
    <header class="w-full max-w-xl text-center pt-2">
        <span class="text-[11px] font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-full shadow-2xs inline-flex items-center gap-1.5">
            <i data-lucide="code" class="w-3.5 h-3.5"></i> Designed & Developed by Darpan Sukla
        </span>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-xl flex-grow flex flex-col items-center justify-center py-6">

        <!-- VIEW 1: Link Generator Dashboard (White Theme) -->
        <div id="generator-view" class="w-full liquid-card p-8 rounded-3xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto border border-indigo-100">
                    <i data-lucide="link" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight text-slate-900">Secure Video Link Creator</h1>
                <p class="text-xs text-slate-500">Paste any YouTube link to generate a direct fullscreen locked stream.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">YouTube Video URL:</label>
                    <input type="text" id="target-url-input" placeholder="https://youtu.be/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs text-slate-900 focus:outline-none focus:border-indigo-600">
                </div>

                <button onclick="generateSecureLink()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-95 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 transition-all cursor-pointer flex items-center justify-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Generate Secure Link
                </button>
            </div>

            <div id="result-box" class="space-y-2 hidden pt-2 border-t border-slate-100">
                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-600">Your Shareable Secure Link:</label>
                <div class="flex gap-2">
                    <input type="text" id="generated-link-output" readonly class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-[11px] text-slate-700 font-mono select-all">
                    <button onclick="copyGeneratedLink()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold border border-slate-200 cursor-pointer shrink-0 flex items-center gap-1.5">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW 2: Completely White Initial Screen (Only Play Icon, No Text) -->
        <div id="player-trigger-view" onclick="launchFullscreenStream()" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6 cursor-pointer hidden">
            <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-violet-600 text-white rounded-full flex items-center justify-center shadow-2xl shadow-indigo-600/40 animate-pulse">
                <i data-lucide="play" class="w-10 h-10 fill-white translate-x-0.5"></i>
            </div>
        </div>

        <!-- VIEW 3: Active Fullscreen Video Container with Auto-hiding Controls -->
        <div id="active-player-container" class="fixed inset-0 z-50 bg-black hidden flex flex-col items-center justify-center" onclick="handleScreenTap()">
            
            <!-- Floating Top Toolbar (Auto-hides after 2 seconds) -->
            <div id="floating-controls" class="absolute top-4 left-4 right-4 z-40 flex items-center justify-between px-4 py-2 bg-slate-900/80 backdrop-blur-md rounded-2xl border border-white/10 text-white transition-opacity-custom opacity-100">
                <div class="flex items-center gap-2 text-xs font-semibold text-indigo-400">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> Secure Fullscreen HD
                </div>
                
                <div class="flex items-center gap-2.5">
                    <!-- Quality Selector Only -->
                    <div class="flex items-center gap-1 bg-black/40 border border-white/20 rounded-xl px-2.5 py-1" onclick="event.stopPropagation()">
                        <i data-lucide="settings" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <select id="quality-select" onchange="changeQuality(this.value)" class="bg-transparent text-[11px] font-bold text-white focus:outline-none cursor-pointer">
                            <option value="hd1080" class="bg-slate-900">1080p</option>
                            <option value="hd720" class="bg-slate-900">720p</option>
                            <option value="default" selected class="bg-slate-900">Auto HD</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Transparent Anti-Scrub Shield -->
            <div class="absolute inset-0 z-30 pointer-events-auto"></div>

            <!-- Edge-to-Edge Fullscreen YouTube Iframe -->
            <iframe id="youtube-iframe" class="absolute inset-0 w-full h-full object-cover pointer-events-none scale-105" src="" title="Protected Player" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

    </main>

    <!-- Footer Attribution -->
    <footer id="main-footer" class="w-full text-center py-4 text-[11px] text-slate-500 border-t border-slate-100 mt-4 space-y-1">
        <p class="font-bold text-slate-700">Secure Protected Learning Portal</p>
        <p>Design & Developed with ❤️ by <span class="text-indigo-600 font-semibold">Darpan Sukla</span></p>
    </footer>

    <script>
        function refreshIcons() {
            lucide.createIcons();
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        let currentVideoId = '';
        let hideControlsTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            refreshIcons();
            const urlParams = new URLSearchParams(window.location.search);
            currentVideoId = urlParams.get('v');

            if (currentVideoId) {
                document.getElementById('generator-view').classList.add('hidden');
                document.getElementById('main-footer').classList.add('hidden');
                document.querySelector('header').classList.add('hidden');
                document.getElementById('player-trigger-view').classList.remove('hidden');
            } else {
                document.getElementById('player-trigger-view').classList.add('hidden');
                document.getElementById('generator-view').classList.remove('hidden');
            }
        });

        function launchFullscreenStream() {
            if (!currentVideoId) return;

            const embedUrl = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&controls=0&disablekb=1&modestbranding=1&rel=0`;
            document.getElementById('youtube-iframe').src = embedUrl;

            document.getElementById('active-player-container').classList.remove('hidden');
            document.getElementById('player-trigger-view').classList.add('hidden');

            const playerContainer = document.getElementById('active-player-container');
            if (playerContainer.requestFullscreen) {
                playerContainer.requestFullscreen().catch(err => {});
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(err => {});
            }

            // Start auto-hide timer for controls upon entering
            startHideControlsTimer();
        }

        function startHideControlsTimer() {
            const controls = document.getElementById('floating-controls');
            controls.style.opacity = '1';
            controls.style.pointerEvents = 'auto';

            if (hideControlsTimer) clearTimeout(hideControlsTimer);

            hideControlsTimer = setTimeout(() => {
                controls.style.opacity = '0';
                controls.style.pointerEvents = 'none';
            }, 2000);
        }

        function handleScreenTap() {
            const controls = document.getElementById('floating-controls');
            if (controls.style.opacity === '0' || controls.style.opacity === '') {
                startHideControlsTimer();
            } else {
                controls.style.opacity = '0';
                controls.style.pointerEvents = 'none';
                if (hideControlsTimer) clearTimeout(hideControlsTimer);
            }
        }

        function generateSecureLink() {
            const rawUrl = document.getElementById('target-url-input').value;
            const videoId = extractYouTubeId(rawUrl);

            if (!videoId) {
                alert("Please enter a valid YouTube video link.");
                return;
            }

            const currentBaseUrl = window.location.origin + window.location.pathname;
            const secureLink = `${currentBaseUrl}?v=${videoId}`;

            document.getElementById('generated-link-output').value = secureLink;
            document.getElementById('result-box').classList.remove('hidden');
            refreshIcons();
        }

        function copyGeneratedLink() {
            const copyText = document.getElementById('generated-link-output');
            copyText.select();
            document.execCommand('copy');
            alert("Secure link copied to clipboard!");
        }

        function changeQuality(qualityVal) {
            console.log("Quality updated:", qualityVal);
        }
    </script>
</body>
</html>
